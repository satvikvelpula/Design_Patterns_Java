sonar.projectKey=OTP_JUnit_Assignment
sonar.projectName=OTP Temperature Converter
sonar.projectVersion=1.0-SNAPSHOT

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.junit.reportPaths=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Keep the same out-of-scope classes as the JaCoCo config in pom.xml
# (GUI / legacy), so SonarQube coverage matches the 80% core-logic target.
sonar.coverage.exclusions=Main*,Launcher*,LocalizationConsole*,TemperatureViewController*,TemperatureConverterGui*,TempRecord*,TemperatureUnit*
